version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: diamondflow-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: diamondflow_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - diamondflow-test-network

  redis:
    image: redis:7-alpine
    container_name: diamondflow-redis-test
    ports:
      - "6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - diamondflow-test-network

networks:
  diamondflow-test-network:
    driver: bridge